<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4A2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A2801F"/>
    </linearGradient>
    <linearGradient id="navyMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4E8C"/>
      <stop offset="100%" stop-color="#0B2D5B"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Mark (width 80, height 80, x=10, y=10) -->
  <g transform="translate(5, 5)">
    <!-- Bastion stem blocks -->
    <rect x="10" y="66" width="15" height="18" rx="2" fill="url(#navyMark)"/>
    <rect x="10" y="45" width="15" height="18" rx="2" fill="url(#navyMark)"/>
    <rect x="10" y="24" width="15" height="18" rx="2" fill="url(#navyMark)"/>
    <!-- Gold crown block -->
    <rect x="10" y="11" width="15" height="10" rx="2" fill="url(#goldGrad)"/>
    
    <!-- Curved B Arches -->
    <path d="M25 16 H52 C65 16, 73 24, 73 35 C73 45, 65 51, 52 51 H25" fill="none" stroke="#0B2D5B" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 47 H57 C71 47, 80 56, 80 68 C80 79, 70 84, 55 84 H25" fill="none" stroke="#0B2D5B" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="50" cy="34" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="55" cy="66" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Lockup -->
  <text x="102" y="44" font-family="'Manrope', 'Inter', sans-serif" font-size="34" font-weight="800" fill="#0B2D5B" letter-spacing="0.08em">BEDF</text>
  <rect x="206" y="22" width="2" height="26" fill="url(#goldGrad)"/>
  <text x="218" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0B2D5B" letter-spacing="0.14em">BELAGAVI ECONOMIC</text>
  <text x="218" y="46" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0B2D5B" letter-spacing="0.14em">DEVELOPMENT FOUNDATION</text>
  
  <!-- Kannada Subtitle & Tagline -->
  <text x="103" y="68" font-family="'Noto Sans Kannada', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#4B5563" letter-spacing="0.02em">ಬೆಳಗಾವಿ ಆರ್ಥಿಕ ಅಭಿವೃದ್ಧಿ ಪ್ರತಿಷ್ಠಾನ</text>
  <text x="103" y="84" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#8A92A6" letter-spacing="0.06em">Building Belagavi. Empowering North Karnataka.</text>
</svg>

